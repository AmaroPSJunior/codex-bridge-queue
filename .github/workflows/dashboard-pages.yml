name: Dashboard Pages
# Playwright visual smoke is part of every dashboard release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - scripts/dashboard-build.cjs
      - task-display.js
      - task-progress.js
      - tests/dashboard-browser.cjs
      - tests/dashboard-auth.test.cjs
      - tests/dashboard.test.cjs
      - tests/dashboard-realtime.test.cjs
      - .github/workflows/dashboard-pages.yml
      - .github/workflows/docs-sync.yml
      - README.md
      - docs/**
permissions:
  contents: read
concurrency:
  group: dashboard-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run docs:generate
      - run: npm test
      - name: Install Playwright Chromium for visual smoke
        run: |
          npm install --prefix .playwright-ci --no-save playwright
          node .playwright-ci/node_modules/playwright/cli.js install --with-deps chromium
      - name: Run Playwright visual smoke
        env:
          NODE_PATH: .playwright-ci/node_modules
        run: node tests/dashboard-browser.cjs
      - run: npm run dashboard:build
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          DASHBOARD_BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
